# ============================================================
# 本地连锁不平衡（LD）计算与过滤服务配置
# ============================================================

# 已提交批次的本地持久化目录（每个批次一个 JSON 文件，原子落盘；重启后据此恢复）
ld.data-dir=${user.dir}/data/batches

# 导入前质量校验的默认阈值（可被每个批次请求中的 filterOptions 覆盖）
# 位点最小次等位基因频率（单态位点始终拒绝）
ld.import.default-min-maf=0.0
# 位点与样本允许的最大基因型缺失比例（超过即整体拒绝该批次）
ld.import.default-max-missing-rate=0.1

# LD 计算任务默认超时（毫秒）；可在提交任务时用 timeoutMillis 覆盖
ld.job.default-timeout-ms=600000

spring.jackson.default-property-inclusion=non_null
