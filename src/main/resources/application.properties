spring.application.name=linkage-disequilibrium-service

# Durable journal directory for committed batches.
ld-service.storage.dir=data/batches
# Default long task timeout in milliseconds.
ld-service.task.default-timeout-millis=300000

# Allow sizeable genotype file uploads.
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
